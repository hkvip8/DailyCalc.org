<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Center | DailyCalc.org</title>
    <meta name="description" content="Manage your points, membership plans, and AI usage history.">
    <link rel="canonical" href="https://dailycalc.org/user/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>
    <script src="../js/global.js" defer></script>
    <script src="../js/common-layout.js" defer></script>
    <script src="../js/user.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="header-placeholder"></div>

    <main class="bg-slate-50">
        <div class="mx-auto main-container px-4 py-6">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft sm:p-8 space-y-6">
                <div class="calc-header">
                    <div class="calc-icon">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div>
                        <h1 class="calc-title">User Center</h1>
                        <p class="calc-desc">Manage points, memberships, and AI usage in one place.</p>
                    </div>
                </div>

                <section class="content-section">
                    <div class="bg-gradient-to-r from-brand-dark to-brand-red px-4 py-2 border-b border-white/10">
                        <h2 class="text-sm font-bold text-white">Points Balance</h2>
                    </div>
                    <div class="p-4 grid gap-4 sm:grid-cols-3">
                        <div class="rounded border border-slate-200 bg-slate-50 p-4">
                            <p class="text-xs text-slate-500">Available Points</p>
                            <p class="text-2xl font-bold text-brand-dark" id="pointsBalance">0</p>
                        </div>
                        <div class="rounded border border-slate-200 bg-slate-50 p-4">
                            <p class="text-xs text-slate-500">Total Spent</p>
                            <p class="text-2xl font-bold text-brand-dark" id="pointsSpent">0</p>
                        </div>
                        <div class="rounded border border-slate-200 bg-slate-50 p-4">
                            <p class="text-xs text-slate-500">Next Tier</p>
                            <p class="text-sm font-semibold text-slate-600" id="pointsTier">Starter</p>
                        </div>
                    </div>
                </section>

                <section class="content-section">
                    <div class="bg-gradient-to-r from-brand-dark to-brand-red px-4 py-2 border-b border-white/10">
                        <h2 class="text-sm font-bold text-white">Purchase Points</h2>
                    </div>
                    <div class="p-4 grid gap-4 sm:grid-cols-3" id="pointPackages"></div>
                </section>

                <section class="content-section">
                    <div class="bg-gradient-to-r from-brand-dark to-brand-red px-4 py-2 border-b border-white/10">
                        <h2 class="text-sm font-bold text-white">Membership Plans</h2>
                    </div>
                    <div class="p-4 grid gap-4 sm:grid-cols-3" id="membershipPlans"></div>
                </section>

                <section class="content-section">
                    <div class="bg-gradient-to-r from-brand-dark to-brand-red px-4 py-2 border-b border-white/10">
                        <h2 class="text-sm font-bold text-white">Points Activity</h2>
                    </div>
                    <div class="p-4 space-y-2" id="pointsHistory"></div>
                </section>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
