<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub | DailyCalc.org</title>
    <meta name="description" content="Explore 100 AI role assistants to help with planning, writing, analysis, and daily decisions.">
    <link rel="canonical" href="https://dailycalc.org/ai/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>
    <script src="../js/global.js" defer></script>
    <script src="../js/common-layout.js" defer></script>
    <script src="../js/ai-roles.js" defer></script>
    <script src="../js/ai-chat.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="header-placeholder"></div>

    <main class="bg-slate-50">
        <div class="mx-auto main-container px-4 py-6">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft sm:p-8">
                <div class="calc-header">
                    <div class="calc-icon">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div>
                        <h1 class="calc-title">AI Hub</h1>
                        <p class="calc-desc">Choose from 100 AI role assistants, each tuned to a specialty.</p>
                    </div>
                </div>

                <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <div class="text-xs text-slate-500">Points required per message: <span class="font-semibold text-slate-700" id="aiPointCost">5</span></div>
                    <div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2">
                        <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                        <input type="search" id="aiSearch" placeholder="Search AI roles..." class="bg-transparent text-xs text-slate-700 focus:outline-none w-56" />
                    </div>
                </div>

                <div id="aiRoleGrid" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
