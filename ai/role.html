<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Role Assistant | DailyCalc.org</title>
    <meta name="description" content="Chat with specialized AI role assistants powered by DailyCalc.org.">
    <link rel="canonical" href="https://dailycalc.org/ai/role.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>
    <script src="../js/global.js" defer></script>
    <script src="../js/common-layout.js" defer></script>
    <script src="../js/ai-roles.js" defer></script>
    <script src="../js/ai-chat.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="header-placeholder"></div>

    <main class="bg-slate-50">
        <div class="mx-auto main-container px-4 py-6">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft sm:p-8">
                <nav class="mb-4 text-xs text-slate-500" aria-label="Breadcrumb">
                    <ol class="flex items-center gap-1">
                        <li><a href="/" class="hover:text-brand-red">Home</a></li>
                        <li><span class="text-slate-400">/</span></li>
                        <li><a href="/ai/" class="hover:text-brand-red">AI Hub</a></li>
                        <li><span class="text-slate-400">/</span></li>
                        <li><span class="font-medium text-slate-700" id="aiRoleBreadcrumb">Role</span></li>
                    </ol>
                </nav>

                <div class="calc-header">
                    <div class="calc-icon">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div>
                        <h1 class="calc-title" id="aiRoleTitle">AI Role Assistant</h1>
                        <p class="calc-desc" id="aiRoleDescription">Chat with a specialized assistant tailored to your needs.</p>
                    </div>
                </div>

                <div class="mt-6 grid gap-4 lg:grid-cols-[2fr_1fr]">
                    <section class="rounded-xl border border-slate-200 bg-slate-50 p-4 shadow-sm">
                        <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-3">
                            <h2 class="text-sm font-bold text-slate-700">Conversation</h2>
                            <span class="text-[10px] text-slate-500">Cost per message: <span class="font-semibold" id="aiRolePointCost">5</span> points</span>
                        </div>
                        <div id="aiChatLog" class="space-y-3 max-h-[360px] overflow-y-auto pr-2"></div>
                        <div class="mt-4 flex flex-col gap-2">
                            <textarea id="aiChatInput" rows="3" class="w-full rounded border border-slate-300 p-2 text-xs text-slate-700" placeholder="Ask the assistant anything..."></textarea>
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] text-slate-500">Available points: <span class="font-semibold" id="aiPointsBalance">0</span></span>
                                <button id="aiSendBtn" class="rounded bg-brand-dark px-4 py-2 text-xs font-bold text-white hover:bg-brand-red transition">Send</button>
                            </div>
                            <p class="text-[10px] text-slate-500">Configure API provider and proxy in the Admin panel.</p>
                        </div>
                    </section>

                    <aside class="space-y-4">
                        <div class="content-section">
                            <div class="bg-gradient-to-r from-brand-dark to-brand-red px-3 py-2 border-b border-white/10">
                                <h2 class="text-xs font-bold text-white">Role Details</h2>
                            </div>
                            <div class="p-4 text-xs text-slate-600 space-y-2" id="aiRoleDetails"></div>
                        </div>
                        <div class="content-section">
                            <div class="bg-gradient-to-r from-brand-dark to-brand-red px-3 py-2 border-b border-white/10">
                                <h2 class="text-xs font-bold text-white">Quick Prompts</h2>
                            </div>
                            <div class="p-4 space-y-2" id="aiQuickPrompts"></div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
